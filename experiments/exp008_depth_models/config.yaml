depth:
  da2:                                        # baseline (exp007): no K
    impl: hf_depth
    runs: [E3_da2]
    params:
      model: da2-metric-indoor-large
      repo: depth-anything/Depth-Anything-V2-Metric-Indoor-Large-hf
      revision: d2fc6a93601aabb1139a3bf0ebfcb4e89c67817f
  uniK:                                        # K conditions the decoder
    impl: unidepth_v2
    runs: [E3_uniK]
    params:
      model: unidepth-v2-vitl14-K
      repo: lpiccinelli/unidepth-v2-vitl14
      revision: 52b349b514bd8b47642f67ac78cb7b5dc5c51dd9
      use_intrinsics: true
      resolution_level: null                      # default 0.2-0.6 MP bounds: native 960x536
  uni:                                        # same network, own camera estimate (K ablation)
    impl: unidepth_v2
    runs: [E3_uni]
    params:
      model: unidepth-v2-vitl14-noK
      repo: lpiccinelli/unidepth-v2-vitl14
      revision: 52b349b514bd8b47642f67ac78cb7b5dc5c51dd9
      use_intrinsics: false
      resolution_level: null
  m3d:                                        # canonical focal 1000 px
    impl: metric3d_v2
    runs: [E3_m3d]
    params:
      model: metric3d-v2-vitl
      repo: JUGGHM/Metric3D
      revision: 80d2d1410afb4b23cd9d18c6be9144483d4b70b6
      checkpoint: metric_depth_vit_large_800k.pth
      input_size: [616, 1064]
  da3m:                                        # canonical focal 300 px at the processing resolution
    impl: da3_metric
    runs: [E3_da3m]
    params:
      model: da3-metric-large
      repo: depth-anything/DA3METRIC-LARGE
      revision: 4010e39f3634a45bc60553321fb49fb760bd594e
      process_res: 504
      process_res_method: upper_bound_resize
      canonical_focal: 300.0
  moge:                                        # fov_x from K (shift only); scale head image-only
    impl: moge2
    runs: [E3_moge]
    params:
      model: moge-2-vitl-normal-fov
      repo: Ruicheng/moge-2-vitl-normal
      revision: cb0e8bbd6b1e243589717c78e750b1ba4c093acf
      use_intrinsics: true
      resolution_level: 9
      use_fp16: true
  dproK:                                        # K's focal
    impl: depth_pro_f
    runs: [E3_dproK]
    params:
      model: depth-pro-K
      repo: apple/DepthPro-hf
      revision: de816c8ce7168afcb231f96d501d72b869d0beda
      use_intrinsics: true
  dpro:                                        # own FOV head (legacy B:depth-pro; K ablation)
    impl: depth_pro_f
    runs: [E3_dpro]
    params:
      model: depth-pro-noK
      repo: apple/DepthPro-hf
      revision: de816c8ce7168afcb231f96d501d72b869d0beda
      use_intrinsics: false

scale:
