    primary: Bsession
    checks: [B, Bnet]
    flag_threshold: 0.10
    methods:
      Bsession: {depth: da2, correction: faces, min_facing: 0.7, pool: segments, depth_window: null, z_max: 4.0, min_cells: 200}
      B: {depth: da2, correction: faces, min_facing: 0.7, fit: scale, min_affine_range: 0.15, depth_window: null, z_max: 4.0, min_cells: 200}
      Bnet: {depth: da2, z_max: 4.0, min_cells: 200}
  E3_uniK:
