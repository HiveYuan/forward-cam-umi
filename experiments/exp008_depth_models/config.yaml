# exp008_depth_models: metric depth networks that take the camera K (UniDepth V2, Metric3D v2, DA3 metric,
# MoGe-2, Depth Pro with K) vs DA2 for the depth + ball scale, with K ablations (UniDepth, Depth Pro).
# exp007's producers unchanged (sam3_v2 masks, tile masks, DROID E3: cache hits). The framework has one
# primary scale per SLAM run, so E3 is declared once per depth model (E3_<model>): identical parameters,
# hence the same cache key and the same trajectory; each alias gets its own depth node and scale block.
# Run:  python -m slam.run experiments/exp008_depth_models/config.yaml
experiment: exp008_depth_models

data:
  session: yam_glove7
  episodes: all
  head_stem: yam_glove7_b0587b
  intrinsics: B0587b_f3_intrinsics.json          # calib/
  glove: yosub
  tile_layout: workspace_tiles_pilot_v3.json      # calib/
  raw_dir: /home/student/yuanliu-hawaii/head-cam-umi/data/raw
  det_cache_dir: /home/student/yuanliu-hawaii/head-cam-umi/calib
  gt_dir: /home/student/yuanliu-hawaii/work/yam_glove7/gt

preprocess:
